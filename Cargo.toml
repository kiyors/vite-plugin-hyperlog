
[package]
authors = ["kiyors <gaurav23617@gmail.com>"]
edition = "2021"
name = "vite_plugin_logger"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23.1"
chrono = "0.4"
colored_json = "5.0.0"
napi-derive = "3.0.0"
oxc_allocator = "0.148.0"
oxc_ast = "0.148.0"
oxc_parser = "0.148.0"
oxc_sourcemap = "8.1.2"
oxc_span = "0.148.0"
regex = "1.13.1"
serde_json = "1.0.151"

[dependencies.napi]
features = ["napi10"]
version = "3.0.0"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
