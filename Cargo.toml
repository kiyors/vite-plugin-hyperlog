
[package]
authors = ["kiyors <gaurav23617@gmail.com>"]
edition = "2021"
name = "vite_plugin_hyperlog"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
libc = { version = "0.2", default-features = false }
napi-derive = "3.0.0"

[dependencies.napi]
default-features = false
features = ["napi10"]
version = "3.0.0"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[lints.clippy]
# 1. The Pedantic Baseline
pedantic = { level = "warn", priority = -1 }

# 2. The "No Cheating" Guard
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# 3. Panic & Silent Failure Guards
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
todo = "deny"
indexing_slicing = "deny"
string_slice = "deny"

# 4. Async & Concurrency Footguns
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
let_underscore_future = "deny"

# 5. Leftover Debugging
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
