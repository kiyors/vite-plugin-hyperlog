
[package]
authors = ["kiyors <gaurav23617@gmail.com>"]
edition = "2021"
name = "vite_plugin_logger"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = "0.4"
napi-derive = "3.0.0"

[dependencies.napi]
features = ["napi10"]
version = "3.0.0"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
